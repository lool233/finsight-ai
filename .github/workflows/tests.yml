name: tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask

      - name: Init SQLite demo database
        run: python init_db.py sqlite

      - name: Smoke tests (53)
        run: python tests/smoke_test.py

      - name: RAG / Agent tests (38)
        run: python tests/rag_agent_test.py

      - name: LLM integration tests (37, local mock server)
        run: python tests/llm_integration_test.py
